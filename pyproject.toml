[project]
name = "planiverse"
version = "0.1.0"
description = "A Python library for planning with simulators."
authors = [
    {name = "Mustafa Faisal",email = "mustafa.faisal.eng@gmail.com"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
# Not every dependency publishes wheels for 3.14 yet, so cap the range rather than fail
# deep inside the install.
requires-python = ">=3.11,<3.14"
# One install gets you every environment. `tests/test_packaging.py` checks that this list
# still covers everything the library imports.
dependencies = [
    "pillow (>=9.1)",               # trace rendering
    "numpy (>=1.26)",
    "pandas (>=2.0,<3)",            # pandapower writes through .values views, which pandas 3's copy-on-write makes read-only
    "networkx (>=3.0)",
    "nasim @ git+https://github.com/MFaisalZaki/NetworkAttackSimulator.git",
    "psutil (>=7.0.0)",
    "pymetasploit3 (>=1.0.6)",
    "python-nmap (>=0.7.1)",
    "matplotlib (>=3.5)",           # the monospace face the trace renderer typesets in
    "fonttools (>=4.22)",           # reads that face's glyphs, so a picture is checked to typeset
    # The benchmark harness: SLURM arrays, the results' analysis, tables and figures. Its runner
    # imports `resource` at import time, so `planiverse-bench solve` and `report` need Linux or
    # macOS, which is where the benchmark runs.
    "pypmt-eval-toolkit @ git+https://github.com/pyPMT/pyPMTEvalToolkit.git",
    "scipy (>=1.10)",               # shortest paths through the flood city's roads
    # The water network, the grid and the crop. Each simulator ships its own benchmark data,
    # so none of them downloads anything at run time.
    "wntr (>=1.2)",                 # EPANET, for the water distribution network
    "grid2op (>=1.10)",             # RTE's power system framework, for the grid
    "pcse (>=6.0)",                 # Wageningen's WOFOST crop model
    "pyyaml (>=6.0)",               # PCSE agromanagement is written as YAML
    # IDM's agent-based epidemic, for the epidemic environment. Covasim 4 is a rewrite on Starsim
    # with a different simulation API, which the environment does not drive.
    "covasim (>=3.1,<4)",
    "eclipse-sumo (>=1.20)",        # the SUMO binaries, for the traffic signals
    "libsumo (>=1.20)",             # SUMO's in-process binding
    # Manchester's water resource simulator, for the reservoirs. It publishes wheels for Linux
    # and Windows only; on macOS build it from source after `brew install glpk` (see the README).
    "pywr (>=1.20) ; sys_platform != 'darwin'",
    # TotalEnergies' microgrid simulator, for the microgrid; its benchmark microgrids ship
    # inside it. It also brings in Gym 0.26, which OR-Gym's inventory runs on.
    "python-microgrid (>=1.4)",
    # BlueSky (the airspace environment) is installed by scripts/install_bluesky.sh: its
    # published dependency list names a placeholder package that does not build.
    "pymunk (>=7.0)",               # Chipmunk2D, for the slingshot physics puzzle
    "factory-sim (>=0.3)",          # a tick-exact C simulator of Factorio's early game, for the factory
    # The two emulator-backed environments. PyBoy needs a cartridge you supply; Stable-Retro
    # ships one freely redistributable game (Airstriker) and takes ROMs you import into it.
    "pyboy (>=2.0)",                # Game Boy emulator, with its game wrappers
    # Farama's fork of Gym Retro: Genesis, NES, SNES and more. It publishes no Windows wheels
    # and supports Windows through WSL2, so a Windows install leaves it out.
    "stable-retro (>=0.9) ; sys_platform != 'win32'",
    # DeepMind's OpenSpiel: every environment is a `pyspiel` game (`planiverse/spiel.py`), and
    # every planner runs on any single-player game. PyPI carries wheels for Linux and macOS
    # only, so a Windows install leaves it out.
    "open_spiel (>=1.5) ; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest (>=8.2)"]      # 8.2 for importorskip's exc_type

[project.scripts]
# The benchmark harness; `python -m planiverse.benchmark` is the same entry point, and it
# is what the generated jobs call, by the absolute path of the interpreter that made them.
planiverse-bench = "planiverse.benchmark:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# The notices file is part of the licensing story, so it travels with the sdist and wheel.
include = ["THIRD-PARTY-NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds (deselect with '-m \"not slow\"')",
]
