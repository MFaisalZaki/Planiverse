[project]
name = "planiverse"
version = "0.1.0"
description = "A Python library for planning with simulators."
authors = [
    {name = "Mustafa Faisal",email = "mustafa.faisal.eng@gmail.com"}
]
license = {text = "GPL-3.0 license"}
readme = "README.md"
# numba and scipy publish no wheels for 3.14 yet, and building them from source needs a
# system OpenBLAS, so cap the range rather than fail deep inside the install.
requires-python = ">=3.11,<3.14"
# One install gets you every environment. `tests/test_packaging.py` checks that this list
# still covers everything the library imports.
dependencies = [
    "pyboy (>=2.5.1,<3.0.0)",
    "pillow (>=9.1)",               # >=9.1 for Image.Resampling, used by vendored PDDLGym
    "numpy (>=1.26)",
    "pandas (>=2.0)",
    "networkx (>=3.0)",
    "numba (>=0.61.0)",
    "scipy (>=1.11)",
    "sympy (>=1.12)",               # EpiPolicy's equation parser
    "gym (>=0.26)",
    "nasim @ git+https://github.com/MFaisalZaki/NetworkAttackSimulator.git",
    "psutil (>=7.0.0)",
    "pymetasploit3 (>=1.0.6)",
    "python-nmap (>=0.7.1)",
    # PDDLGym is vendored under planiverse/simulator/wrappers/pddlgym/ rather than
    # installed, because the published package pins `pillow <10`, which has no Python 3.13
    # wheels and whose sdist cannot build there. These are its own dependencies; see
    # planiverse/simulator/wrappers/pddlgym/VENDORING.md.
    "matplotlib (>=3.5)",
    "imageio (>=2.0)",
    "scikit-image (>=0.20)",
    # The three simulator-backed environments. Each ships its own benchmark data, so none
    # of them downloads anything at run time.
    "wntr (>=1.2)",                 # EPANET, for the water distribution network
    "grid2op (>=1.10)",             # RTE's power system framework, for the grid
    "pcse (>=6.0)",                 # Wageningen's WOFOST crop model
    "pyyaml (>=6.0)",               # PCSE agromanagement is written as YAML
]

[project.optional-dependencies]
dev = ["pytest (>=8.0)"]

[project.scripts]
# The benchmark harness. Generated SLURM jobs invoke this by name, so an experiment prepared
# on one machine runs unchanged on a cluster where the package is pip-installed.
planiverse-bench = "planiverse.benchmark.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds (deselect with '-m \"not slow\"')",
]
