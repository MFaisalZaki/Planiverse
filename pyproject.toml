[project]
name = "planiverse"
version = "0.1.0"
description = "A Python library for planning with simulators."
authors = [
    {name = "Mustafa Faisal",email = "mustafa.faisal.eng@gmail.com"}
]
license = {text = "GPL-3.0 license"}
readme = "README.md"
# numba and scipy publish no wheels for 3.14 yet, and building them from source needs a
# system OpenBLAS, so cap the range rather than fail deep inside the install.
requires-python = ">=3.11,<3.14"
# One install gets you every environment. `tests/test_packaging.py` checks that this list
# still covers everything the library imports.
dependencies = [
    "pyboy (>=2.5.1,<3.0.0)",
    "pillow (>=9)",                 # pyboy renders a screenshot through it
    "numpy (>=1.26)",
    "pandas (>=2.0)",
    "networkx (>=3.0)",
    "numba (>=0.61.0)",
    "scipy (>=1.11)",
    "sympy (>=1.12)",               # EpiPolicy's equation parser
    "gym (>=0.26)",
    "nasim @ git+https://github.com/MFaisalZaki/NetworkAttackSimulator.git",
    "psutil (>=7.0.0)",
    "pymetasploit3 (>=1.0.6)",
    "python-nmap (>=0.7.1)",
    # pddlgym 0.0.7 requires `pillow <10`, and Pillow published no wheels for Python 3.13.
    # Building 9.5.0 from source there fails in its own setup.py: `get_version` reads the
    # version by exec-ing a file and pulling it back out of `locals()`, which PEP 667
    # stopped working in 3.13. Without this marker `pip install .` dies building Pillow on
    # 3.13; with it, 3.13 installs everything else and only the PDDLGym wrapper is
    # unavailable. Use Python 3.12 or older if you need it.
    "pddlgym (>=0.0.7,<0.0.8) ; python_version < '3.13'",
]

[project.optional-dependencies]
dev = ["pytest (>=8.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds (deselect with '-m \"not slow\"')",
]
