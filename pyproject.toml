[project]
name = "planiverse"
version = "0.1.0"
description = "A Python library for planning with simulators."
authors = [
    {name = "Mustafa Faisal",email = "mustafa.faisal.eng@gmail.com"}
]
license = {text = "GPL-3.0 license"}
readme = "README.md"
# numba and scipy publish no wheels for 3.14 yet, and building them from source needs a
# system OpenBLAS, so cap the range rather than fail deep inside the install.
requires-python = ">=3.11,<3.14"
dependencies = [
    "pddlgym (>=0.0.7,<0.0.8)",
    "pyboy (>=2.5.1,<3.0.0)",
    "nasim @ git+https://github.com/MFaisalZaki/NetworkAttackSimulator.git",
    "psutil (>=7.0.0)",
    "pymetasploit3 (>=1.0.6)",
    "python-nmap (>=0.7.1)",
    "chex (>=0.1.89)",
    "flax (>=0.10.4)",
    "jaxmarl (>=0.0.7)",
    "dill (>=0.3.9)",
    "numba (>=0.61.0)",
    "numpy (>=1.26)",
    "pandas (>=2.0)",
    "networkx (>=3.0)",
    "scipy (>=1.11)",
    "sympy (>=1.12)",
    "pcg_benchmark @ git+https://github.com/amidos2006/pcg_benchmark.git"
]

[project.optional-dependencies]
dev = ["pytest (>=8.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds (deselect with '-m \"not slow\"')",
]