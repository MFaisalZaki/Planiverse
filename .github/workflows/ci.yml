# Install the library the way the README says to, on every supported platform and Python,
# check that the install covers the environments it is meant to, and run the test suite.
#
# Two jobs. `install-and-test` is the documented install (`pip install -e ".[dev]"` and the
# pooltool script) on Linux, macOS and Windows for Python 3.11 to 3.13, plus the macOS build
# of pywr from source that the README describes. `scripted-simulators` runs the scripts for
# the two simulators pip cannot install on its own (Micropolis, BlueSky) on Linux and macOS
# and tests the environments behind them.
name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the library, the documented way
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install pooltool, the billiards table
        run: python scripts/install_pooltool.py

      # pywr publishes no macOS wheels; the README documents this build and this checks it.
      - name: Build pywr from source (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install glpk
          export CFLAGS="-I$(brew --prefix glpk)/include" LDFLAGS="-L$(brew --prefix glpk)/lib"
          PYWR_BUILD_LPSOLVE=false python -m pip install pywr

      # Everything an install is meant to cover on this platform has to import. The two
      # simulators built by the scripts are the other job's business; Stable-Retro (`retro`)
      # has no Windows wheels (see pyproject.toml).
      # libsumo's Windows wheel fails to import on the runner ("DLL load failed while importing
      # _libsumo: the specified procedure could not be found"), so the traffic environment is
      # allowed to be missing there while this step says which SUMO library does not load.
      - name: libsumo on Windows, which DLL fails
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'EOF'
          import ctypes, os, shutil, sumo
          folder = os.path.join(sumo.SUMO_HOME, "bin")
          os.add_dll_directory(folder)
          for name in sorted(os.listdir(folder)):
              if not name.endswith(".dll") or name.startswith("osgdb_"):
                  continue
              try:
                  ctypes.WinDLL(os.path.join(folder, name))
              except OSError as error:
                  print("FAIL", name, error)
              elsewhere = shutil.which(name)
              if elsewhere and not elsewhere.lower().startswith(folder.lower()):
                  print("SHADOWED", name, "by", elsewhere)
          import libsumo
          print("libsumo imported", libsumo.__version__)
          EOF

      - name: What this install covers
        shell: bash
        run: |
          expect="micropolis,airspace"
          if [ "$RUNNER_OS" = "Windows" ]; then expect="$expect,retro,traffic"; fi
          python tools/check_install.py --expect-missing "$expect"

      - name: Test
        run: python -m pytest -m "not slow" --durations=15

  scripted-simulators:
    name: ${{ matrix.os }}, the scripted simulators
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the library
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python scripts/install_pooltool.py

      - name: Build the Micropolis engine
        run: |
          python -m pip install swig
          bash scripts/build_micropolis.sh

      - name: Install BlueSky
        run: bash scripts/install_bluesky.sh

      - name: What this install covers
        shell: bash
        run: |
          expect=""
          if [ "$RUNNER_OS" = "macOS" ]; then expect="reservoir"; fi   # pywr: see the other job
          python tools/check_install.py --expect-missing "$expect"

      - name: Test the environments behind the scripts
        run: >
          python -m pytest -m "not slow" --durations=15
          tests/test_micropolis.py tests/test_operational_four.py
          tests/test_interface.py tests/test_generators.py tests/test_packaging.py
